name: Test

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - "docs/**"
      - "**.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  # This ensures tests also run when directly triggered by workflow_dispatch
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gnome: ${{ steps.scope.outputs.gnome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          fi
          if [ "$EVENT" != pull_request ] || grep -Eq '^contrib/gnome-extension/|^\.github/|^Makefile$|^scripts/|^pkg/|^internal/|^cmd/|^go\.(mod|sum)$' "$RUNNER_TEMP/changed-files"; then
            echo 'gnome=true' >> "$GITHUB_OUTPUT"
          else
            echo 'gnome=false' >> "$GITHUB_OUTPUT"
          fi
  gnome-extension:
    name: GNOME ${{ matrix.gnome }} Wayland UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gnome: [48, 49, 50, 51]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run extension checks
        run: bash contrib/gnome-extension/tests/run-tests.sh
      - name: Test in GNOME and capture screenshots
        env:
          CONTAINER_RUNTIME: docker
          GNOME_VERSION: ${{ matrix.gnome }}
        run: make -C contrib/gnome-extension test-gnome
      - name: Upload screenshots and session logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gnome${{ matrix.gnome }}-ui-${{ github.run_attempt }}
          path: dist/gnome${{ matrix.gnome }}-*/
          retention-days: 7
          if-no-files-found: warn

    needs: changes
    if: needs.changes.outputs.gnome == 'true'
  test:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Display Go version
        run: go version

      - name: Verify dependencies
        run: go mod verify

      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./pkg/... ./internal/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0

      - name: Run tests with coverage
        run: |
          # Test all packages except keylightd-tray which requires frontend to be built
          go test -race -coverprofile=coverage.txt -covermode=atomic \
            ./cmd/... \
            ./pkg/... \
            ./internal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          fail_ci_if_error: false

      # Indicate test completion for debugging
      - name: Test completion status
        run: echo "Tests completed successfully at $(date)"
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
