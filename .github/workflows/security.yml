name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        if: matrix.language == 'go'
        with:
          node-version: "24"
      - name: Prepare desktop tray build
        if: matrix.language == 'go'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          npm ci --prefix contrib/keylightd-tray/frontend
          npm run build --prefix contrib/keylightd-tray/frontend
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go packages for analysis
        if: matrix.language == 'go'
        run: go build -tags webkit2_41 ./...
      - uses: github/codeql-action/analyze@v4.38.2
