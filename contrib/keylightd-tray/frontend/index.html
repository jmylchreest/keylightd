<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Keylight Control</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div id="app">
            <header class="header">
                <h1>Keylight Control</h1>
                <div class="header-right">
                    <span class="status-badge" id="status-badge"
                        >Loading...</span
                    >
                    <button
                        class="master-toggle"
                        id="master-toggle-btn"
                        title="Toggle all lights"
                    >
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"
                            />
                        </svg>
                    </button>
                    <button
                        class="icon-button"
                        id="settings-btn"
                        title="Settings"
                    >
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                            />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="settings-panel" id="settings-panel" inert>
                <div class="settings-header">
                    <button id="prefs-back" class="icon-button" aria-label="Back">‹</button>
                    <strong>Keylight Control</strong>
                    <button id="settings-close-btn" class="icon-button" aria-label="Close preferences">×</button>
                </div>
                <div class="settings-content"><div class="prefs-body">
<section class="pref-page" data-view="index" hidden><h2>Preferences</h2>
<button class="pref-row" data-page="connection" ><span class="pref-symbol" aria-hidden="true">⇄</span><span class="pref-copy"><strong>Connection</strong><small><span id="summary-connection">Connection method</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="lights" ><span class="pref-symbol" aria-hidden="true">☀</span><span class="pref-copy"><strong>Lights</strong><small><span id="summary-lights">Light visibility</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="groups" ><span class="pref-symbol" aria-hidden="true">▦</span><span class="pref-copy"><strong>Groups</strong><small><span id="summary-groups">Light groups</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="display" ><span class="pref-symbol" aria-hidden="true">▣</span><span class="pref-copy"><strong>Display</strong><small><span id="summary-display">Refresh interval</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="about" ><span class="pref-symbol" aria-hidden="true">ⓘ</span><span class="pref-copy"><strong>About</strong><small><span id="summary-about">Versions and build information</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
</section>
<section class="pref-page" data-view="connection" hidden><h2>Connection</h2>
<button class="pref-row" data-page="local" id="method-local"><span class="pref-symbol" aria-hidden="true">▣</span><span class="pref-copy"><strong>This computer</strong><small><span id="socket-summary">Unix socket</span></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="secure" id="method-secure"><span class="pref-symbol" aria-hidden="true">⚿</span><span class="pref-copy"><strong>Paired HTTPS</strong><small>Pair using an invitation</small></span><span class="pref-tail" aria-hidden="true">›</span></button>
<button class="pref-row" data-page="manual" id="method-manual"><span class="pref-symbol" aria-hidden="true">⇄</span><span class="pref-copy"><strong>Manual address</strong><small>API address and key</small></span><span class="pref-tail" aria-hidden="true">›</span></button>
</section>
<section class="pref-page" data-view="local" hidden><h2>This computer</h2>
<label class="pref-field">Socket path<input id="socket-path" type="text" placeholder="Default socket"></label><button class="btn btn-secondary" id="use-local">Test and use</button>
</section>
<section class="pref-page" data-view="manual" hidden><h2>Manual address</h2>
<label class="pref-field">API address<input id="api-url" type="url" value="http://localhost:9123"></label><label class="pref-field">API key<input id="api-key" type="password" autocomplete="off"></label><button class="btn btn-secondary" id="use-manual">Test and use</button>
</section>
<section class="pref-page" data-view="secure" hidden><h2>Paired HTTPS</h2>
<div id="secure-panel" hidden>
    <button class="pref-row" id="enter-invitation">
        <span class="pref-symbol" aria-hidden="true">⇄</span>
        <span class="pref-copy"><strong>Use an invitation</strong><small>Pair this tray with a daemon</small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
  <div id="local-https" hidden>
    <h3>On this computer</h3>
    <button class="pref-row" id="issue-invitation">
        <span class="pref-symbol" aria-hidden="true">+</span>
        <span class="pref-copy"><strong>Create invitation</strong><small>Pair another client</small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
    <button class="pref-row" id="enable-https">
        <span class="pref-symbol" aria-hidden="true">⚿</span>
        <span class="pref-copy"><strong><span id="enable-label">Enable and use HTTPS</span></strong><small><span id="listener-status"></span></small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
    <button class="pref-row" id="disable-https">
        <span class="pref-symbol" aria-hidden="true">⚿</span>
        <span class="pref-copy"><strong>Disable HTTPS</strong><small>HTTPS enabled</small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
    <button class="pref-row" data-page="addresses">
        <span class="pref-symbol" aria-hidden="true">⇄</span>
        <span class="pref-copy"><strong>Network address</strong><small><span id="chosen-address"></span></small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
    <button class="pref-row" data-page="identity">
        <span class="pref-symbol" aria-hidden="true">ⓘ</span>
        <span class="pref-copy"><strong>Daemon identity</strong><small><span id="identity-summary"></span></small></span>
        <span class="pref-tail" aria-hidden="true">›</span>
    </button>
  </div>
</div>
</section>
<section class="pref-page" data-view="addresses" hidden><h2>Network address</h2>
<label class="pref-field">Connection address<select id="secure-address"></select></label>
</section>
<section class="pref-page" data-view="identity" hidden><h2>Daemon identity</h2>
<p id="fingerprint"></p><button class="btn btn-secondary" id="forget-https">Forget identity…</button>
</section>
<section class="pref-page" data-view="lights" hidden><h2>Lights</h2>
<h3>Show in the tray</h3><div id="visibility-lights"></div><div class="pref-actions"><button class="btn btn-secondary" id="show-lights">Show all</button><button class="btn btn-secondary" id="hide-lights">Hide all</button></div>
</section>
<section class="pref-page" data-view="groups" hidden><h2>Groups</h2>
<div id="group-editor"></div><button class="pref-row" data-page="new-group" ><span class="pref-symbol" aria-hidden="true">+</span><span class="pref-copy"><strong>Create group</strong><small></small></span><span class="pref-tail" aria-hidden="true">›</span></button>
</section>
<section class="pref-page" data-view="new-group" hidden><h2>Create group</h2>
<label class="pref-field">Group name<input id="new-group-name" type="text" ></label><button class="btn btn-secondary" id="create-group">Create group</button>
</section>
<section class="pref-page" data-view="edit" hidden><h2>Edit group</h2>
<div id="group-members"></div><div class="pref-actions"><button class="btn btn-secondary" id="delete-group">Delete group…</button><button class="btn btn-secondary" id="save-group">Save group</button></div>
</section>
<section class="pref-page" data-view="display" hidden><h2>Display</h2>
<label class="pref-field">Refresh interval (seconds)<input id="refresh-interval" type="number" min="1" max="10" step="0.5" required></label>
</section>
<section class="pref-page" data-view="about" hidden><h2>About</h2>
<h3>Keylight Control</h3><p id="about-version"></p><p id="about-daemon-version"></p>
</section>
<p id="secure-notice" role="status"></p>
                </div></div>
            </div>
            <main class="main">
                <section class="section" id="groups-section">
                    <h2>Groups</h2>
                    <div class="controls-list" id="groups-list">
                        <!-- Groups will be inserted here -->
                    </div>
                </section>

                <section class="section" id="lights-section">
                    <h2>Lights</h2>
                    <div class="controls-list" id="lights-list">
                        <!-- Lights will be inserted here -->
                    </div>
                </section>
            </main>
            <dialog id="secure-dialog" aria-labelledby="secure-title">
                <h2 id="secure-title"></h2><p id="secure-description"></p>
                <textarea aria-label="Pairing invitation" id="secure-code" rows="3" spellcheck="false" hidden></textarea>
                <p role="alert" id="secure-error"></p>
                <div class="dialog-actions"><button class="btn btn-secondary" id="secure-cancel">Cancel</button><button class="btn btn-primary" id="secure-confirm">Continue</button></div>
            </dialog>

            <!-- version shown in Settings > About -->
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
